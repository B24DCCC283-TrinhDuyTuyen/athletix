name: athletix
description: "Athletix - Nền tảng phân tích kỹ thuật điền kinh bằng AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management - quản lý trạng thái app
  flutter_riverpod: ^2.6.1

  # Navigation - điều hướng màn hình
  go_router: ^14.6.2

  # Charts - vẽ biểu đồ
  fl_chart: ^0.69.0

  # Fonts đẹp (Outfit, Inter)
  google_fonts: ^6.2.1

  # Format ngày tháng
  intl: ^0.19.0

  # Icons thể thao
  cupertino_icons: ^1.0.8

  # Networking & Image Picker
  http: ^1.2.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
